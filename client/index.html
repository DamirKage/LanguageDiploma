<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LinguaPath — персональная платформа для изучения казахского, английского, турецкого, немецкого и испанского языков." />
    <meta name="theme-color" content="#13121B" />
    <script>
      try {
        var theme = localStorage.getItem('linguapath.theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>LinguaPath — изучение языков</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
